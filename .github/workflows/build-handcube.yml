# Self-contained build: no other project files need to be uploaded.
name: Build HandCube IPA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-handcube.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Unpack embedded project
        env:
          PROJECT_ZIP: 
        run: |
          python3 - <<'PYTHON'
          import os, base64, io, zipfile
          zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['PROJECT_ZIP']))).extractall('.')
          from pathlib import Path
          p = Path('ios/HandCube/scripts/build-ipa.sh')
          p.write_text(p.read_text().replace('lipo -verify_arch arm64 "$APP/HandCube"', 'lipo "$APP/HandCube" -verify_arch arm64'))
          PYTHON
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned arm64 IPA
        run: bash ios/HandCube/scripts/build-ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HandCube-unsigned-IPA
          path: |
            ios/HandCube/build/HandCube-unsigned.ipa
            ios/HandCube/build/HandCube-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
