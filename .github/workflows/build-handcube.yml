# HandPanel 0.13: self-contained iOS project, ARKit world anchor and hand ray.
name: Build HandCube IPA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-handcube.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Unpack HandPanel 0.13 project
        env:
          PROJECT_ZIP: 
        run: |
          python3 - <<'PYTHON'
          import os, base64, io, zipfile
          zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['PROJECT_ZIP']))).extractall('.')
          PYTHON
      - name: Fetch pinned OpenXR headers
        run: |
          mkdir -p ios/HandCube/HandCube/OpenXR/include/openxr
          curl -fsSL --retry 3 https://raw.githubusercontent.com/KhronosGroup/OpenXR-SDK/release-1.0.34/include/openxr/openxr.h -o ios/HandCube/HandCube/OpenXR/include/openxr/openxr.h
          curl -fsSL --retry 3 https://raw.githubusercontent.com/KhronosGroup/OpenXR-SDK/release-1.0.34/include/openxr/openxr_platform_defines.h -o ios/HandCube/HandCube/OpenXR/include/openxr/openxr_platform_defines.h
          shasum -a 256 -c <<'CHECKSUMS'
          f7d670c13053cfa503512213820184d0986c5b9de173d1c16f0753acec267f07  ios/HandCube/HandCube/OpenXR/include/openxr/openxr.h
          47738e2088a63051ab586fd44da1e0c556aa6f78ccc841bb5eeb29b13e3704c3  ios/HandCube/HandCube/OpenXR/include/openxr/openxr_platform_defines.h
          CHECKSUMS
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned arm64 IPA
        run: bash ios/HandCube/scripts/build-ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HandCube-unsigned-IPA
          path: |
            ios/HandCube/build/HandCube-unsigned.ipa
            ios/HandCube/build/HandCube-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
