<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#752c38"><meta name="description" content="Узнайте, насколько хорошо вы знаете Михаила Булгакова: два уровня, 30 вопросов и разбор ответов."><title>Между строк — тест о Булгакове</title><style>
:root{--paper:#f6f2e9;--ink:#282b27;--muted:#79796f;--red:#752c38;--line:#d9d6ca;--green:#36634d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Arial,sans-serif}button,a,input{touch-action:manipulation}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #b3803b;outline-offset:5px}button:disabled{cursor:default;opacity:.45}header{max-width:1190px;margin:auto;padding:25px 35px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{border:0;background:none;font:700 23px Georgia;color:var(--ink);padding:0}.brand span{color:var(--red);margin-right:10px}.edition,.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted)}main{max-width:1120px;margin:auto;padding:50px 30px}h1,h2,h3,p{margin-top:0}h1{font:normal clamp(54px,7vw,88px)/1.04 Georgia;margin:23px 0}h1 em{color:var(--red)}h2{font:normal clamp(27px,3vw,38px)/1.25 Georgia}h3{font:normal 27px Georgia}.intro{max-width:490px;color:#6b6c62;font-size:17px}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:50px;align-items:center;margin-bottom:50px}.art{height:320px;position:relative;display:grid;place-items:center;overflow:hidden;background:#e9e4d8;border-radius:50% 50% 3px 3px;border:1px solid #d7d0bf}.art:before{content:'М';position:absolute;font:280px Georgia;color:#d6cebc;left:15px;top:-45px}.art .sheet{background:#faf7ef;transform:rotate(-9deg);width:220px;padding:30px 25px;box-shadow:15px 18px 0 #c8bdab,0 20px 35px #5b493122;border:1px solid #d5cdbd;z-index:1}.sheet b{font:22px Georgia;display:block}.sheet hr{border:0;border-top:1px solid #b7afa0;margin:15px 0}.sheet small{font:13px Georgia}.seal{position:absolute;right:30px;bottom:30px;background:var(--red);color:#f6f2e9;border-radius:50%;height:90px;width:90px;display:grid;place-content:center;text-align:center;transform:rotate(12deg);font:13px Georgia;z-index:2}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.section-head h2{font-size:27px;margin:0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}.level{position:relative;text-align:left;background:transparent;border:1px solid var(--line);border-radius:4px;padding:27px;color:var(--ink);transition:.2s}.level:hover{transform:translateY(-3px);border-color:var(--red)}.level.selected{border:2px solid var(--red);padding:26px;background:#eee5dc}.level .num{color:var(--red);font:italic 23px Georgia;float:right}.level h3{margin:8px 0}.level p{font-size:14px;color:#686b61;margin-bottom:20px}.tag{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--red)}.meta{font-size:12px;color:var(--muted)}.start-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:25px}.primary{background:var(--red);border:1px solid var(--red);color:#fff;padding:15px 25px;border-radius:3px}.secondary{background:transparent;border:1px solid var(--line);padding:12px 20px;border-radius:3px;color:var(--ink)}.subtle{color:var(--muted);font-size:12px}.note{margin-top:35px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:12px}footer{max-width:1060px;margin:20px auto;padding:22px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:1px}a{color:var(--red)}.quiz{max-width:790px;margin:0 auto}.quiz-top{display:flex;justify-content:space-between;gap:15px;align-items:center}.progress{height:3px;background:var(--line);margin:20px 0 38px}.progress i{display:block;background:var(--red);height:3px;transition:width .3s}.options{display:grid;gap:12px;margin:30px 0}.option{text-align:left;display:flex;align-items:center;gap:18px;width:100%;padding:18px;background:#fcfaf5;border:1px solid var(--line);border-radius:3px;color:var(--ink)}.letter{border:1px solid var(--line);min-width:32px;height:32px;display:grid;place-content:center;font-size:12px}.option.chosen{border-color:var(--red);background:#eee5dc}.option.correct{border-color:var(--green);background:#e6ede2}.option.wrong{border-color:var(--red);background:#f1dfda}.option:disabled{opacity:1}.feedback{padding:20px;border-left:3px solid var(--green);background:#e9ede3;margin-bottom:20px}.feedback.bonus{border-color:#a17b3b;background:#eee7d7}.feedback p{font-size:14px;margin:6px 0 0}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.dots{display:flex;gap:7px;flex-wrap:wrap;margin-top:28px}.dot{width:30px;height:30px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:11px}.dot.active{border-color:var(--red);font-weight:bold}.dot.done{background:#e2e5d9}.score{font:100px/1.2 Georgia;color:var(--red);margin:25px 0}.score small{font-size:32px;color:var(--muted)}.result-head{text-align:center;padding:20px 0 40px}.review{border-top:1px solid var(--line);padding:20px 0}.review summary{cursor:pointer;font-family:Georgia;font-size:19px}.review p{font-size:14px;margin:12px 0 0}.pill{font:11px Arial;color:var(--muted);display:block;margin-bottom:5px}.sources{margin-top:30px;font-size:12px}.sources a{margin-right:16px}label{font-size:13px;display:flex;align-items:center;gap:8px}input{accent-color:var(--red)}@media(max-width:700px){header{padding:20px}.edition{font-size:9px;letter-spacing:1px}main{padding:30px 20px}.hero{grid-template-columns:1fr;gap:10px;margin-bottom:30px}.art{display:none}h1{font-size:61px}.cards{grid-template-columns:1fr}.start-row{align-items:stretch;flex-direction:column;gap:15px}.start-row .primary{width:100%}footer{margin:20px;padding:20px 0;gap:20px}.quiz-top{font-size:12px}.option{padding:14px}.nav button{padding:12px 15px}.section-head .eyebrow{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><button class="brand" id="home"><span>❧</span> Между строк</button><span class="edition">Литературный тест · № 01</span></header><main id="app"></main><footer><span>МИХАИЛ БУЛГАКОВ · 1891–1940</span><span>Читать. Вспоминать. Открывать.</span></footer><script>const questions = [
['Какую специальность по первому образованию получил Михаил Булгаков?',['Филолог-славист','Врач-хирург и терапевт','Юрист'],1,'Булгаков окончил медицинский факультет Киевского университета. Официальная квалификация — лекарь; хирургия и терапия были частью его практики.'],
['В каком городе родился Михаил Афанасьевич Булгаков?',['Москва','Санкт-Петербург','Киев'],2,'Булгаков родился в Киеве в 1891 году.'],
['Кем работал Булгаков во время земской практики в Смоленской губернии?',['Главным врачом уездной больницы','Единственным врачом на большой врачебный участок','Военным полевым хирургом'],1,'В Никольском молодой врач самостоятельно принимал пациентов и проводил операции. Этот опыт отразился в «Записках юного врача».'],
['С каким периодом связано решение Булгакова оставить медицину в 1920 году?',['Тяжелое ранение на фронте','Эпидемия, с которой он не справился','Работа врачом на Кавказе и решение сменить профессию'],2,'На Кавказе Булгаков перенёс тиф и перешёл к литературной и театральной работе. Это был процесс, а не единственный точно установленный эпизод.'],
['Какая пьеса принесла Булгакову триумф на сцене МХАТ в 1926 году?',['«Дни Турбиных»','«Зойкина квартира»','«Багровый остров»'],0,'«Дни Турбиных» впервые поставили во МХАТе в 1926 году.'],
['Как сложилась судьба пьес Булгакова к 1930 году?',['Их с успехом ставили в Лондоне','Постановки были запрещены и сняты с репертуара','Их экранизировали в Голливуде'],1,'К 1930 году пьесы Булгакова исчезли с советской сцены. Позднее «Дни Турбиных» вернули в репертуар.'],
['В каком качестве Булгаков работал во МХАТе с 1930 года?',['Художественный руководитель','Главный драматург и режиссер-постановщик','Режиссер-ассистент и консультант-литератор'],2,'Булгаков был принят режиссером-ассистентом; занимался также инсценировками и литературной работой.'],
['Кто была третьей женой Булгакова и хранительницей его архива?',['Любовь Белозерская','Татьяна Лаппа','Елена Шиловская'],2,'Елена Сергеевна Булгакова, в предыдущем браке Шиловская, сохранила наследие писателя.'],
['С кем у Булгакова состоялся знаменитый телефонный разговор в 1930 году?',['С Владимиром Маяковским','С Иосифом Сталиным','С Сергеем Эйзенштейном'],1,'Сталин позвонил писателю 18 апреля 1930 года, после его обращения к правительству.'],
['В каком жанре Булгаков активно работал в начале московского периода?',['Фельетоны, очерки и сатирические заметки','Поэмы и литературная критика','Переводы зарубежной фантастики'],0,'Газетная работа, в том числе в «Гудке», стала важной частью раннего московского периода.'],
['Какое увлечение приписано Булгакову в исходной подборке?',['Коллекционирование старинных монет','Футбол и боление за «Динамо»','Шахматные турниры международного уровня'],null,'Утверждение о страстном болении за «Динамо» не подтверждено использованными источниками. Надежного ключа для этих вариантов нет; вопрос не влияет на результат.'],
['От какого заболевания скончался Булгаков в марте 1940 года?',['Туберкулез легких','Гипертонический криз и инсульт','Тяжелая болезнь почек — нефросклероз'],2,'Причиной смерти стала тяжелая болезнь почек — нефросклероз.'],
['Где покоится прах Михаила Булгакова?',['На Ваганьковском кладбище','На Новодевичьем кладбище','У Кремлевской стены'],1,'Могила писателя находится на Новодевичьем кладбище в Москве.'],
['Какой киевский памятник связан с образом Города в «Белой гвардии»?',['Памятник Богдану Хмельницкому','Памятник князю Владимиру','Памятник основателям Киева'],1,'Крест князя Владимира над Днепром — один из узнаваемых образов романа.'],
['Как сложилась судьба брата писателя Николая после революции?',['Стал советским наркомом','Эмигрировал и стал ученым-биологом, работал во Франции','Погиб в рядах Красной армии'],1,'Николай Булгаков эмигрировал, занимался бактериологией и работал во Франции.'],
['В каком учебном заведении Киева учился будущий писатель?',['В Первой киевской гимназии','В Коллегии Павла Галагана','В Киевском кадетском корпусе'],0,'Булгаков учился в Первой киевской гимназии. Оценка «самая строгая и лучшая» субъективна.'],
['Где Булгаков получил опыт прифронтовой медицинской работы в Первую мировую войну?',['В госпиталях Каменец-Подольска и Черновцов','В госпитале Киево-Печерской лавры','В военном госпитале Варшавы'],0,'В 1916 году Булгаков работал в прифронтовых госпиталях Каменец-Подольска и Черновцов.'],
['В каком городе на Кавказе Булгаков оказался как врач в 1919 году?',['Во Владикавказе','В Саратове','В Житомире'],0,'Владикавказ стал местом перехода Булгакова от медицинской к литературной и театральной работе.'],
['С каким изданием связана активная работа Булгакова-фельетониста в Москве?',['С газетой «Гудок»','С «Крокодилом» под псевдонимом Homo Necans','С «Сатириконом» под псевдонимом М. Б.'],0,'Булгаков сотрудничал с «Гудком», подписывая тексты своим именем и другими подписями.'],
['Какое объединение якобы приняло Булгакова, но затем он порвал с ним по идеологическим причинам?',['Союз поэтов и «Никитинские субботники»','«Маковец» и конструктивисты','Пролеткульт'],null,'Булгаков выступал на «Никитинских субботниках», но заявленный в вопросе сюжет о вступлении и идеологическом разрыве не установлен. Вопрос оставлен для обсуждения.'],
['За какой конкретный эпизод «Дней Турбиных» критики обвиняли автора в «белогвардейщине»?',['Самоубийство генерала Черноярова','Финальная песня юнкеров и офицеров под гитару о гибели','Отказ главного героя присягнуть новой власти в финале'],null,'Предложенные варианты не дают надежного ответа. Критика была направлена на изображение белых офицеров в целом; сводить ее к одному из этих эпизодов некорректно.'],
['Что произошло с пьесой «Батум», написанной к юбилею Сталина в 1939 году?',['Постановку запретили, поездку театральной группы в Грузию прервали','После единственного спектакля ее сняли','Автор сжег рукопись на репетиции'],0,'В исходнике ошибочно указан 1929 год. Пьеса написана в 1939-м; поездка была для сбора материала, а не на премьеру.'],
['Кого, кроме Николая Покровского, называют прототипом профессора Преображенского?',['Николая Пирогова','Ивана Павлова','Владимира Бехтерева'],null,'Существуют разные исследовательские гипотезы, включая Павлова и Бехтерева. Однозначно выбрать один вариант нельзя; музей Булгакова называет главным прототипом Николая Покровского.'],
['Какую работу Булгаков выполнял во Владикавказе в 1920 году?',['Руководил литературной и театральной секциями подотдела искусств','Был главным санитарным инспектором Терека','Работал только рецензентом «Голоса бедняка»'],0,'Формулировка уточнена: речь о литературной и театральной работе после установления советской власти, а не «до захвата города белыми».'],
['Почему Булгаков уничтожил раннюю редакцию своего главного романа в 1930 году?',['Из-за ареста друга и опасения обыска','Из-за творческого кризиса и травли','Случайно при пожаре'],null,'Рукопись была сожжена в марте, а не в январе 1930 года, на фоне запретов и тяжелого положения писателя. Предложенные варианты чрезмерно упрощают или выдумывают мотивы; точный психологический мотив не оценивается.'],
['Какой научный контекст особенно близок к фантастике «Собачьего сердца»?',['Опыты по омоложению и пересадке тканей — Штейнах, Воронов','Открытие радиоактивности супругами Кюри','Передача изображений по телеграфу'],0,'Медицинские эксперименты по омоложению — важный контекст повести. Влияние рентгеновских лучей на оба произведения не следует считать столь же установленным.'],
['О чем Булгаков просил Правительство СССР в письме 1930 года?',['О командировке за рубеж на три года','Разрешить выезд из СССР либо предоставить работу в театре','Принять его в Союз советских писателей'],1,'Письмо датировано 28 марта 1930 года. Фраза «Я писатель…» из исходной подборки не является его заключительной строкой.'],
['С каким режиссером у Булгакова были сложные творческие отношения во МХАТе?',['С Всеволодом Мейерхольдом','С Константином Станиславским','С Александром Таировым'],1,'Отношения со Станиславским и работа над постановками отразились в «Театральном романе».'],
['Какой опыт оперного либреттиста был у Булгакова в 1930-е годы?',['Либретто «Минин и Пожарский» и работа в Большом театре','Оперы «Черный дьявол» и «Рашель» для Малого оперного театра','Переводы французских оперетт'],0,'В Большой театр Булгаков перешел в 1936 году. В исходнике этот опыт ошибочно отнесен к концу 1920-х.'],
['Как Павел Сергеевич Попов помог сохранить наследие Булгакова?',['Спрятал архив на даче под Малоярославцем','Вместе с Еленой Сергеевной разбирал и систематизировал материалы','Вывез рукописи дипломатической почтой'],1,'Друг писателя и его ранний биограф Попов помогал Елене Сергеевне работать с наследием Булгакова.']
];
</script><script>const app=document.getElementById('app');let level=0,items=[],answers=[],checked=[],position=0,mode='home',shuffle=false;
const labels=['Базовый','Сложный'];
function sources(){return `<div class="sources">Материалы для проверки: <a href="https://www.bulgakov.ru/biography/1921-1930/" target="_blank" rel="noopener">Летопись 1921–1930</a><a href="https://www.bulgakov.ru/biography/1931-1940/" target="_blank" rel="noopener">Летопись 1931–1940</a><a href="https://www.bulgakovmuseum.ru/projects/moscow/address/62" target="_blank" rel="noopener">Музей Булгакова</a></div>`}
function home(){mode='home';app.innerHTML=`<section class="hero"><div><div class="eyebrow">Жизнь и творчество Михаила Булгакова</div><h1>Знаете ли вы<br><em>Мастера?</em></h1><p class="intro">От земской больницы до подмостков МХАТа.<br>Пройдите по страницам жизни писателя —<br>и откройте детали между строк.</p><span class="meta">30 вопросов &nbsp; / &nbsp; 2 уровня &nbsp; / &nbsp; без ограничения времени</span></div><div class="art" aria-hidden="true"><div class="sheet"><small>МИХАИЛ АФАНАСЬЕВИЧ</small><b>БУЛГАКОВ</b><hr><small>Медицина. Литература. Театр.</small><hr><small>Киев · Москва<br>1891 — 1940</small><hr><small>Страницы одной жизни</small></div><div class="seal">ЛИТЕРАТУРНОЕ<br>ДЕЛО<br>№ 01</div></div></section><section><div class="section-head"><h2>Выберите свою главу</h2><span class="eyebrow">С чего начнем?</span></div><div class="cards">${labels.map((l,i)=>`<button class="level ${level===i?'selected':''}" data-level="${i}" aria-pressed="${level===i}"><span class="num">0${i+1}</span><span class="tag">${i?'Для внимательного читателя':'Знакомство с писателем'}</span><h3>${l} уровень</h3><p>${i?'Литературные связи, театральные истории и детали биографии.':'Главные события жизни, известные произведения и близкие люди.'}</p><span class="meta">15 вопросов · ${i?'11 основных + 4 бонусных':'14 основных + 1 бонусный'} &nbsp; ↗</span></button>`).join('')}</div><div class="start-row"><label><input type="checkbox" id="shuffle" ${shuffle?'checked':''}>Перемешать порядок вопросов</label><button class="primary" id="start">Начать тест &nbsp; →</button></div><div class="note">За каждый верный основной ответ — 1 балл. После проверки появится пояснение. В исходной подборке есть спорные утверждения: такие вопросы отмечены как бонусные и не влияют на оценку. Очевидные неточности в датах и формулировках исправлены.</div></section>${sources()}`;document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;home()});document.getElementById('shuffle').onchange=e=>shuffle=e.target.checked;document.getElementById('start').onclick=start}
function start(){items=questions.slice(level*15,level*15+15);if(shuffle)for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}answers=Array(items.length).fill(null);checked=Array(items.length).fill(false);position=0;mode='quiz';render();window.scrollTo(0,0)}
function render(){const q=items[position],done=checked[position],bonus=q[2]===null,n=checked.filter(Boolean).length;app.innerHTML=`<section class="quiz"><div class="quiz-top"><span class="tag">${labels[level]} уровень</span><span class="meta">Вопрос ${position+1} из ${items.length} · Проверено ${n}</span></div><div class="progress" role="progressbar" aria-label="Прогресс теста" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${items.length}"><i style="width:${n/items.length*100}%"></i></div><div class="eyebrow">${bonus?'Бонусный вопрос · без оценки':'Биография и творчество'}</div><h2 tabindex="-1" id="question">${q[0]}</h2><div class="options">${q[1].map((v,i)=>`<button class="option ${answers[position]===i?'chosen':''} ${done&&!bonus?(q[2]===i?'correct':answers[position]===i?'wrong':''):''}" data-answer="${i}" aria-pressed="${answers[position]===i}" ${done?'disabled':''}><span class="letter">${'АБВ'[i]}</span><span>${v}</span>${done&&q[2]===i?'<span aria-label="Правильный ответ">✓</span>':''}</button>`).join('')}</div>${done?`<div class="feedback ${bonus?'bonus':''}" role="status"><strong>${bonus?'Вопрос для обсуждения':answers[position]===q[2]?'Верно!':'Правильный ответ: '+ 'АБВ'[q[2]]}</strong><p>${q[3]}</p></div>`:''}<div class="nav"><button class="secondary" id="prev" ${position===0?'disabled':''}>← Назад</button><button class="primary" id="next" ${!done&&answers[position]===null?'disabled':''}>${done?(n===items.length?'Посмотреть результат →':'Следующий вопрос →'):'Проверить ответ'}</button></div><div class="dots" aria-label="Навигация по вопросам">${items.map((_,i)=>`<button class="dot ${i===position?'active':''} ${checked[i]?'done':''}" data-go="${i}" aria-label="Вопрос ${i+1}${checked[i]?', проверен':''}" ${i===position?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><p class="subtle" style="margin-top:18px">После проверки ответ нельзя изменить. Бонусные вопросы не влияют на балл.</p></section>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[position]=+b.dataset.answer;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));document.getElementById('prev').onclick=()=>go(position-1);document.getElementById('next').onclick=()=>{if(!done){checked[position]=true;render()}else if(n===items.length){result();window.scrollTo(0,0)}else{let next=(position+1)%items.length;while(checked[next])next=(next+1)%items.length;go(next)}}}
function go(i){position=i;render();document.getElementById('question').focus();window.scrollTo(0,0)}
function result(){mode='result';const total=items.filter(q=>q[2]!==null).length,score=items.filter((q,i)=>q[2]!==null&&q[2]===answers[i]).length,pct=Math.round(score/total*100);app.innerHTML=`<section class="quiz"><div class="result-head"><span class="eyebrow">Глава прочитана · ${labels[level]} уровень</span><div class="score">${score}<small> / ${total}</small></div><h2>${pct>=85?'Вы читаете между строк':pct>=55?'Хорошее знакомство с Мастером':'Впереди много открытий'}</h2><p class="intro" style="margin:0 auto 25px">${pct}% верных ответов. ${items.length-total} бонусных вопросов не включены в оценку.</p><button class="primary" id="retry">Пройти еще раз</button> <button class="secondary" id="levels">Выбрать уровень</button></div><h3>Разбор ответов</h3>${items.map((q,i)=>`<details class="review"><summary><span class="pill">${q[2]===null?'БОНУС · БЕЗ ОЦЕНКИ':q[2]===answers[i]?'✓ ВЕРНО':'✕ ОШИБКА'}</span>${i+1}. ${q[0]}</summary><p>Ваш ответ: ${q[1][answers[i]]}</p>${q[2]!==null?`<p><strong>Правильный ответ: ${q[1][q[2]]}</strong></p>`:''}<p>${q[3]}</p></details>`).join('')}${sources()}</section>`;document.getElementById('retry').onclick=start;document.getElementById('levels').onclick=()=>{home();window.scrollTo(0,0)}}
document.getElementById('home').onclick=()=>{if(mode!=='quiz'||confirm('Вернуться к выбору уровня? Текущий прогресс будет сброшен.')){home();window.scrollTo(0,0)}};home();
</script></body></html>
